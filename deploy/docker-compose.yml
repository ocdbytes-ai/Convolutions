# Easiest path on a single WSL laptop, run from the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
# Paths below are relative to this file (deploy/), so ../ is the repo root.
services:
  train:
    build:
      context: .. 
      dockerfile: deploy/Dockerfile
    image: resnet18-cifar10:latest
    # argparse flags for train-resnet; edit freely.
    command: ["--epochs", "100", "--batch-size", "256", "--workers", "4"]
    volumes:
      - type: bind
        source: ../data                # CIFAR download persists here
        target: /workspace/data
      - type: bind
        source: ../outputs             # checkpoint written here
        target: /workspace/outputs
    # DataLoader workers share memory via /dev/shm; the container default (64MB)
    # is too small and causes "DataLoader worker killed" bus errors. Raise it.
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
